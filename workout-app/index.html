<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="theme-color" content="#f3f2f2">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%23f3f2f2'/><rect x='28' y='84' width='16' height='44' rx='5' fill='%239d4b33' opacity='0.4'/><rect x='136' y='84' width='16' height='44' rx='5' fill='%239d4b33' opacity='0.4'/><rect x='48' y='92' width='14' height='28' rx='4' fill='%23201e1d'/><rect x='118' y='92' width='14' height='28' rx='4' fill='%23201e1d'/><rect x='62' y='102' width='56' height='8' fill='%23201e1d'/></svg>">
<title>Workouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="../shared.js"></script>
<style>
/* ═══ Broadsheet tokens (from broadsheet-tokens.css) ═══ */
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #46657f;   /* slate — interactive (was process cyan) */
  --color-accent-2: #9d4b33;  /* rust — lift spot color (was process magenta) */
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #e9eef3;
  --color-accent-700: #3a566e;
  --color-accent-2-100: #f5eae5;
  --color-accent-2-700: #7c3a26;
  --color-process-yellow: #edbb00;

  --font-heading: "Source Serif 4", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Source Serif 4", system-ui, sans-serif;

  --space-1: 5px; --space-2: 10px; --space-3: 15px; --space-4: 20px;
  --radius-sm: 1px; --radius-md: 2px; --radius-lg: 4px;
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);

  --status-green: oklch(0.55 0.14 150);
  --status-red: oklch(0.55 0.19 27);
  /* Solid-fill button green stays at press depth in both themes */
  --status-green-fill: oklch(0.55 0.14 150);
  /* Paper-on-fill text for primary/finish buttons — paper in both themes */
  --color-on-fill: var(--color-bg);

  color-scheme: light;
}

/* ═══ Dark theme (manual toggle, default light) — paper type on an ink
   ground with the same muted slate/rust inks. Tonal ramps flip
   end-for-end; accent text steps lighten to hold contrast; elevation
   becomes a hairline edge + ambient darkness. ═══ */
html.dark {
  --color-bg: #1b1a19;
  --color-surface: #262424;
  --color-text: #f3f2f2;
  --color-divider: color-mix(in srgb, #f3f2f2 16%, transparent);

  --color-neutral-100: #2d2b2b;
  --color-neutral-200: #444141;
  --color-neutral-300: #605d5d;
  --color-neutral-400: #7d7979;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #bab6b6;
  --color-neutral-700: #d7d3d3;
  --color-neutral-800: #eae7e7;
  --color-neutral-900: #f8f4f4;

  --color-accent-100: #232c34;
  --color-accent-700: #9fb8cc;
  --color-accent-2-100: #33241d;
  --color-accent-2-700: #cf9075;

  --status-green: oklch(0.70 0.12 150);
  --status-red: oklch(0.66 0.17 27);

  --color-on-fill: #f3f2f2;

  --shadow-sm: 0 0 0 1px color-mix(in srgb, #f3f2f2 7%, transparent), 0 1px 2px rgba(0,0,0,0.5);
  --shadow-md: 0 0 0 1px color-mix(in srgb, #f3f2f2 10%, transparent), 0 3px 10px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px color-mix(in srgb, #f3f2f2 10%, transparent), 0 12px 32px rgba(0,0,0,0.65);

  color-scheme: dark;
}
html.dark .timerbar { box-shadow: 0 -8px 28px rgba(0,0,0,0.55); }
html.dark .idlestrip { box-shadow: 0 -8px 28px rgba(0,0,0,0.35); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--color-bg); color: var(--color-text);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55; font-weight: 400;
  -webkit-tap-highlight-color: transparent;
}
button { -webkit-tap-highlight-color: transparent; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) 18px; border-radius: var(--radius-md);
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-on-fill); }
.btn-primary:hover { background: #3d5971; }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }

.card {
  border-radius: var(--radius-lg); background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

/* ═══ App layout ═══ */
.wrap {
  max-width: 430px; margin: 0 auto;
  padding: 6px 22px calc(140px + env(safe-area-inset-bottom, 0px));
}

.rule-thick { border-top: 3px solid var(--color-text); }
.rule-thin { border-top: 1px solid var(--color-text); margin-top: 2px; }

/* Week nav */
.weeknav { display: flex; justify-content: space-between; align-items: baseline; }
.weeknav a {
  font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none;
  user-select: none; white-space: nowrap; color: var(--color-accent-700);
}
.weeknav a.dim { color: var(--color-neutral-300); pointer-events: none; }
.weeknav a:first-child { padding: 8px 10px 8px 0; }
.weeknav a:last-child { padding: 8px 0 8px 10px; }

.masthead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; gap: 10px; }
.masthead .brand { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; }
.masthead .range { font-size: 11px; color: var(--color-neutral-600); white-space: nowrap; }

.kicker {
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
  color: var(--color-accent-2-700); white-space: nowrap;
}
.headline-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 5px; }
.headline-row .h {
  font-family: var(--font-heading); font-weight: 600; font-size: 30px;
  line-height: 1.04; letter-spacing: -.015em;
}
.headline-row .sub { font-size: 12px; color: var(--color-neutral-600); white-space: nowrap; }

/* Day tiles */
.tiles { margin-top: 16px; display: grid; grid-template-columns: 1fr; gap: 10px; padding-bottom: 8px; }
.tile {
  padding: 9px 14px; cursor: pointer; display: flex; flex-direction: row;
  align-items: center; gap: 12px; min-height: 58px; border: none; text-align: left;
  font-family: inherit; color: inherit; width: 100%;
}
.tile:hover { box-shadow: var(--shadow-md); }
.tile.today { outline: 2px solid var(--color-text); outline-offset: -2px; }
.tile .dateblk { width: 40px; flex-shrink: 0; }
.tile .dow { font-size: 9.5px; letter-spacing: .12em; color: var(--color-neutral-500); font-weight: 600; display: block; }
.tile .dom { font-family: var(--font-heading); font-weight: 600; font-size: 23px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .icon { display: flex; flex-shrink: 0; }
.tile .nameblk { flex: 1; min-width: 0; }
.tile .wname { font-size: 14px; font-weight: 600; font-family: var(--font-heading); line-height: 1.25; display: block; }
.tile .todaytag { font-size: 9px; letter-spacing: .12em; color: var(--color-accent-2-700); font-weight: 600; font-family: var(--font-body); }
.tile .meta { font-size: 10.5px; color: var(--color-neutral-500); display: block; margin-top: 1px; }
.tile .mark { font-weight: 700; flex-shrink: 0; line-height: 1; }

/* Breadcrumbs */
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; padding: 6px 0 4px; font-size: 12.5px; }
.crumbs a {
  display: inline-block; font-weight: 600; color: var(--color-accent-700);
  cursor: pointer; padding: 4px 0; text-decoration: none; user-select: none;
}
.crumbs .sep { color: var(--color-neutral-400); }
.crumbs .here { color: var(--color-neutral-600); padding: 4px 0; }

.dateline { font-size: 10.5px; color: var(--color-neutral-700); padding-top: 5px; letter-spacing: .03em; }
.dateline-row { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--color-neutral-700); padding-top: 5px; }

.day-h {
  font-family: var(--font-heading); font-weight: 600; font-size: 33px;
  line-height: 1.04; letter-spacing: -.015em; margin-top: 6px;
}
.day-sub { font-size: 13px; color: var(--color-neutral-700); margin-top: 8px; line-height: 1.5; max-width: 34ch; }

.exlist { padding: 22px 0 0; display: flex; flex-direction: column; gap: 11px; }
.exrow { display: flex; align-items: baseline; gap: 12px; }
.exrow .n { font-size: 11px; color: var(--color-neutral-500); width: 12px; font-variant-numeric: tabular-nums; }
.exrow .nm { font-size: 15px; font-weight: 600; font-family: var(--font-heading); flex: 1; }
.exrow .sch { font-size: 12px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }

/* Routine options */
.opts { padding: 28px 0 24px; }
.opts .okick {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600;
  color: var(--color-neutral-600); margin-bottom: 6px;
}
.opt {
  display: flex; align-items: center; gap: 11px; padding: 10px 0; cursor: pointer;
  border: none; background: none; width: 100%; font-family: inherit; color: inherit; text-align: left;
  min-height: 44px;
}
.opt:hover { background: var(--color-neutral-100); }
.opt .ring { width: 15px; height: 15px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid var(--color-neutral-400); }
.opt .ring.on { border: 5px solid var(--color-accent-700); }
.opt .olabel { flex: 1; font-size: 14px; font-weight: 600; font-family: var(--font-heading); }
.opt .swatch { width: 9px; height: 9px; flex-shrink: 0; border-radius: 2px; }

/* Session tiles */
.stile {
  padding: 11px 14px; cursor: pointer; display: flex; flex-direction: row;
  align-items: center; gap: 12px; min-height: 58px; border: none; text-align: left;
  font-family: inherit; color: inherit; width: 100%;
}
.stile:hover { box-shadow: var(--shadow-md); }
.stile .nameblk { flex: 1; min-width: 0; }
.stile .wname { font-size: 14.5px; font-weight: 600; font-family: var(--font-heading); line-height: 1.25; display: block; }
.stile .sch { font-size: 10.5px; color: var(--color-neutral-600); font-variant-numeric: tabular-nums; display: block; margin-top: 1px; }
.stile .prog { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }

.finish-btn {
  width: 100%; margin-top: 20px; height: 50px; font-size: 15px; margin-bottom: 24px;
  background: var(--status-green-fill); border-color: transparent; color: var(--color-on-fill);
}
.finish-btn:hover { background: oklch(0.48 0.14 150); }
.finish-btn:active { background: oklch(0.43 0.14 150); }

/* Exercise screen */
.ex-name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ex-h { font-family: var(--font-heading); font-weight: 600; font-size: 30px; line-height: 1.05; letter-spacing: -.015em; }
.ex-clock {
  font-family: var(--font-heading); font-weight: 600; font-size: 20px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.ex-target { font-size: 13px; color: var(--color-neutral-700); margin-top: 6px; }
.ex-last { font-size: 12px; color: var(--color-neutral-600); margin-top: 9px; }

.sets { padding: 18px 0 0; display: flex; flex-direction: column; gap: 10px; }
.setrow-logged { display: grid; grid-template-columns: 30px 1fr 52px; gap: 10px; align-items: center; height: 48px; }
.setrow-edit { display: grid; grid-template-columns: 30px 1fr 1fr 52px; gap: 8px; align-items: center; }
.slabel { font-size: 12px; font-weight: 700; color: var(--color-neutral-500); font-variant-numeric: tabular-nums; }
.ssummary { font-size: 17px; font-variant-numeric: tabular-nums; }
.sunlog {
  width: 52px; height: 44px; border: none; background: none; font-size: 20px;
  color: var(--color-accent-700); font-weight: 700; cursor: pointer;
}
.stepper {
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
  height: 52px; padding: 0 2px; background: var(--color-bg);
}
.stepper button { width: 38px; height: 44px; border: none; font-size: 20px; padding: 0; }
.stepper .val { text-align: center; line-height: 1.05; }
.stepper .val .num { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper .val .unit { font-size: 9px; letter-spacing: .1em; color: var(--color-neutral-500); }
.slog { width: 52px; height: 52px; font-size: 20px; padding: 0; }

.helper { font-size: 11.5px; color: var(--color-neutral-600); }

/* Timer bar */
.timerbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
  width: 100%; max-width: 430px; background: var(--color-bg);
  box-shadow: 0 -8px 28px rgba(45,43,43,0.18);
  padding: 12px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; z-index: 50;
}
.timerbar .tinfo { flex: 1; min-width: 0; }
.timerbar .tkick { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
.timerbar .tnext {
  font-size: 12px; color: var(--color-neutral-700); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
}
.timerbar .tclock {
  font-family: var(--font-heading); font-weight: 600; font-size: 31px;
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.timerbar .tplus { height: 46px; font-size: 13px; padding-inline: 12px; }
.timerbar .tskip { height: 46px; font-size: 16px; padding-inline: 8px; color: var(--color-neutral-600); }
.idlestrip {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
  width: 100%; max-width: 430px; background: var(--color-bg);
  padding: 10px 22px calc(16px + env(safe-area-inset-bottom, 0px));
  font-size: 11px; color: var(--color-neutral-500);
  box-shadow: 0 -8px 28px rgba(45,43,43,0.08); z-index: 50;
}

/* Footer tools + data modal (re-homed from prior app) */
.tools { display: flex; gap: 14px; justify-content: flex-end; padding: 10px 0 20px; }
.tools button {
  background: transparent; color: var(--color-neutral-500); border: none;
  font-size: 11px; padding: 4px 0; cursor: pointer; font-family: inherit;
  text-decoration: underline; text-underline-offset: 2px;
}
.tools button:hover { color: var(--color-accent-700); }

.data-backdrop {
  position: fixed; inset: 0; background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.data-backdrop.open { display: flex; }
.data-modal {
  width: min(440px, 100%); max-height: 88vh; display: flex; flex-direction: column;
  border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.data-modal header {
  padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--color-divider);
}
.data-modal header h2 { margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 18px; }
.data-modal header button { background: none; border: none; font-size: 26px; color: var(--color-neutral-600); cursor: pointer; line-height: 1; }
.data-modal .body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.data-sec { padding: 12px; background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: var(--radius-lg); }
.data-sec h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.data-sec p { margin: 0 0 8px; font-size: 12px; color: var(--color-neutral-600); line-height: 1.5; }
.data-sec textarea {
  width: 100%; min-height: 100px; padding: 10px; border: 1px solid var(--color-divider);
  border-radius: var(--radius-md); font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; background: var(--color-surface); resize: vertical;
}
.data-sec .row { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="timerRoot"></div>

<div class="data-backdrop" id="dataModal">
  <div class="data-modal">
    <header>
      <h2>Export / Import data</h2>
      <button id="dataModalClose" title="Close">×</button>
    </header>
    <div class="body">
      <div class="data-sec">
        <h3>Export from this device</h3>
        <p>Tap Copy → on your other device (same Apple ID), open this page and tap Import. Universal Clipboard carries it over.</p>
        <textarea id="dataExport" readonly></textarea>
        <div class="row"><button class="btn btn-primary" id="dataCopyBtn">Copy to clipboard</button></div>
      </div>
      <div class="data-sec">
        <h3>Import onto this device</h3>
        <p><strong>This replaces all current data on this device.</strong> Paste JSON exported from another device, then tap Import.</p>
        <textarea id="dataImport" placeholder="Paste exported JSON here…"></textarea>
        <div class="row"><button class="btn btn-primary" id="dataImportBtn">Import &amp; replace</button></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
// ============================================================
// PROGRAM DATA — ids match the historical workout-schedule-v3 exercise keys
// exs: [exId, name, sets, repsLabel, repLow, restSecs, defW]
// ============================================================
const R = {
  chestA: { name: "Chest & Tris A — Heavy", kind: "lift", sub: "Heavy day — 4–8 reps at 2–3 in reserve, long rests.", exs: [
    ["bench", "Bench Press", 4, "4–6", 4, 180, 135],
    ["ohp", "Overhead Press", 3, "6–8", 6, 150, 95],
    ["incline_db", "Incline DB Press", 3, "8–10", 8, 120, 50],
    ["dips", "Dips", 3, "6–10", 6, 120, 0],
    ["skullcrusher", "Skullcrusher", 3, "8–10", 8, 90, 60],
    ["lat_raise", "Lateral Raise", 3, "12–15", 12, 60, 20],
  ]},
  chestB: { name: "Chest & Tris B — Volume", kind: "lift", sub: "Volume day — 8–20 reps pushed to 0–2 in reserve.", exs: [
    ["db_bench", "Flat DB Press", 4, "8–12", 8, 120, 60],
    ["cable_fly", "Cable Fly", 3, "12–15", 12, 90, 30],
    ["db_press", "DB Shoulder Press", 3, "10–12", 10, 120, 40],
    ["oh_tri", "Overhead Cable Ext", 3, "10–15", 10, 90, 40],
    ["tri_push", "Tricep Pushdown", 3, "12–15", 12, 90, 50],
  ]},
  backA: { name: "Back & Bis A — Heavy", kind: "lift", sub: "Heavy day — 4–8 reps at 2–3 in reserve, long rests.", exs: [
    ["deadlift", "Deadlift", 3, "4–6", 4, 210, 225],
    ["bb_row", "Barbell Row", 4, "5–7", 5, 180, 155],
    ["pullup", "Pull-ups", 3, "6–8", 6, 150, 0],
    ["face_pull", "Face Pull", 3, "12–15", 12, 90, 40],
    ["bb_curl", "Barbell Curl", 3, "8–10", 8, 90, 65],
    ["ham_curl", "Hammer Curl", 3, "10–12", 10, 60, 30],
  ]},
  backB: { name: "Back & Bis B — Volume", kind: "lift", sub: "Volume day — 8–20 reps pushed to 0–2 in reserve.", exs: [
    ["pulldown", "Lat Pulldown", 4, "10–12", 10, 120, 120],
    ["cable_row", "Seated Cable Row", 3, "10–12", 10, 120, 120],
    ["sa_pulldown", "Straight-Arm Pulldown", 3, "12–15", 12, 90, 50],
    ["rear_delt", "Rear Delt Fly", 3, "15–20", 15, 60, 15],
    ["incline_curl", "Incline DB Curl", 3, "10–15", 10, 90, 25],
    ["cable_curl", "Cable Curl", 3, "12–15", 12, 60, 40],
  ]},
  legs: { name: "Legs — Squat & Hinge", kind: "lift", sub: "Squat and hinge — heavy compounds first, isolation after.", exs: [
    ["squat", "Back Squat", 4, "4–6", 4, 180, 185],
    ["rdl", "Romanian Deadlift", 3, "6–8", 6, 150, 155],
    ["leg_press", "Leg Press", 3, "8–10", 8, 120, 270],
    ["leg_curl", "Leg Curl", 3, "8–12", 8, 90, 90],
    ["leg_ext", "Leg Extension", 3, "10–12", 10, 90, 100],
    ["calf_stand", "Standing Calf Raise", 4, "8–12", 8, 90, 135],
    ["ab_wheel", "Ab Wheel", 3, "10–15", 10, 60, 0],
  ]},
  tempo: { name: "Tempo Ride", kind: "bike", sub: "45–60 min · Zone 3 · 20–30 min in tempo." },
  long: { name: "Long Ride / Intervals", kind: "bike", sub: "60–90 min · Zone 2 base, or 6 × 3 min hard." },
  rest: { name: "Rest", kind: "rest", sub: "Recovery — easy walk, stretch, sleep. The growing happens here." },
};
const OPTION_ORDER = ["chestA", "chestB", "backA", "backB", "legs", "tempo", "long", "rest"];
const WEEKS = 12;
const WEIGHT_STEP = 5;

// ============================================================
// DATES
// ============================================================
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
function mondayOf(d) { const x = new Date(d); const g = (x.getDay() + 6) % 7; x.setDate(x.getDate() - g); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dk(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function parseDk(k) { const a = k.split("-").map(Number); return new Date(a[0], a[1]-1, a[2]); }
const TODAY_K = dk(TODAY);

// ============================================================
// STATE — same localStorage contract as the previous app
// { "YYYY-MM-DD": { workout?, routine?, completed?, skipped?, sets?: {exId:[{w,r,at}]}, log? }, _program: {start} }
// ============================================================
const STORAGE_KEY = "workout-schedule-v3";
const V2_KEY = "workout-schedule-v2";
const V1_KEY = "workout-schedule-v1";

function loadState() {
  let st;
  try {
    st = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!st) {
      const v2 = JSON.parse(localStorage.getItem(V2_KEY) || "null");
      if (v2) st = v2;
      else {
        const v1 = JSON.parse(localStorage.getItem(V1_KEY) || "{}");
        st = {};
        for (const [k, v] of Object.entries(v1)) if (typeof v === "string") st[k] = { workout: v };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
    }
  } catch (e) { st = {}; }
  // One-time: legacy workout:"Skip" becomes the redesign's skipped flag
  let touched = false;
  for (const [k, e] of Object.entries(st)) {
    if (k.startsWith("_") || !e || typeof e !== "object") continue;
    if (e.workout === "Skip") { delete e.workout; e.skipped = true; touched = true; }
  }
  if (touched) localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
  return st;
}

let state = loadState();
function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function dayEntry(k) { return state[k] || null; }
function editEntry(k, fn) {
  const e = state[k] || {};
  fn(e);
  if (Object.keys(e).length === 0) delete state[k];
  else state[k] = e;
  persist();
}

// Program anchor (existing behavior: stamped on first load, drives emphasis parity + deloads)
function programStart() {
  if (!state._program || !state._program.start) {
    state._program = { start: dk(mondayOf(TODAY)) };
    persist();
  }
  return parseDk(state._program.start);
}
const PROG_START = programStart();
function weekIdx(d) { return Math.round((mondayOf(d).getTime() - PROG_START.getTime()) / 6048e5); }
function isChestWeek(d) { return ((weekIdx(d) % 2) + 2) % 2 === 0; }
function isDeloadIdx(idx) { return idx >= 0 && idx % 6 === 5; }

function defRoutine(d) {
  const dow = (d.getDay() + 6) % 7;
  const m = isChestWeek(d)
    ? ["chestA", "backA", "tempo", "chestB", "legs", "long", "rest"]
    : ["backA", "chestA", "tempo", "backB", "legs", "long", "rest"];
  return m[dow];
}

// Resolve the routine for a day, honoring both new-style overrides (routine id
// covers rides/rest too) and the pre-redesign workout/routine fields.
function routineFor(k) {
  const e = dayEntry(k);
  const d = parseDk(k);
  if (e) {
    if (e.routine && R[e.routine]) return e.routine;
    if (e.workout === "Rest") return "rest";
    if (e.workout === "Bike") return ((d.getDay() + 6) % 7) === 5 ? "long" : "tempo";
    if (e.workout === "Lift") return isChestWeek(d) ? "chestB" : "backB";
  }
  return defRoutine(d);
}

function setOverride(k, rid) {
  const d = parseDk(k);
  editEntry(k, e => {
    if (defRoutine(d) === rid) { delete e.routine; delete e.workout; return; }
    e.routine = rid;
    const kind = R[rid].kind;
    e.workout = kind === "lift" ? "Lift" : kind === "bike" ? "Bike" : "Rest";
  });
}

function isDone(k) {
  if (window.cosShared) {
    const w = window.cosShared.get(k, "workout");
    if (w && w.completed) return true;
  }
  return !!(dayEntry(k) || {}).completed;
}
function setDone(k, val) {
  const kind = R[routineFor(k)].kind;
  if (window.cosShared) {
    window.cosShared.setWorkout(k, val ? {
      completed: true,
      type: kind === "lift" ? "Lift" : kind === "bike" ? "Bike" : "Rest",
      loggedAt: new Date().toISOString(),
    } : null);
  }
  editEntry(k, e => {
    if (val) { e.completed = true; delete e.skipped; }
    else delete e.completed;
  });
}
function isSkipped(k) { return !!(dayEntry(k) || {}).skipped; }
function toggleSkipped(k) {
  editEntry(k, e => { if (e.skipped) delete e.skipped; else e.skipped = true; });
}

// Sets — stored under state[k].sets[exId] as [{w,r,at}|null,...] (v3 contract)
function getLogged(k, exId) {
  const e = dayEntry(k);
  return (e && e.sets && e.sets[exId]) || [];
}
function saveSet(k, exId, i, w, r) {
  editEntry(k, e => {
    if (!e.sets) e.sets = {};
    if (!e.sets[exId]) e.sets[exId] = [];
    e.sets[exId][i] = { w, r, at: new Date().toISOString() };
  });
}
function unlogSet(k, exId, i) {
  editEntry(k, e => {
    if (!e.sets || !e.sets[exId]) return;
    e.sets[exId][i] = null;
    while (e.sets[exId].length && !e.sets[exId][e.sets[exId].length - 1]) e.sets[exId].pop();
    if (!e.sets[exId].length) delete e.sets[exId];
    if (!Object.keys(e.sets).length) delete e.sets;
  });
}
function addExtraSet(k, exId, minRows) {
  editEntry(k, e => {
    if (!e.sets) e.sets = {};
    if (!e.sets[exId]) e.sets[exId] = [];
    const target = Math.max(minRows, e.sets[exId].length) + 1;
    while (e.sets[exId].length < target) e.sets[exId].push(null);
  });
}
function lastSession(exId, beforeK) {
  let best = "";
  for (const [k, e] of Object.entries(state)) {
    if (k.startsWith("_") || k >= beforeK) continue;
    if (e.sets && e.sets[exId] && e.sets[exId].some(s => s && s.r)) { if (k > best) best = k; }
  }
  if (!best) return null;
  return { k: best, sets: state[best].sets[exId].filter(s => s && s.r) };
}

// ============================================================
// THEME — manual toggle, default light; rides along in state (_prefs)
// ============================================================
function currentTheme() { return (state._prefs && state._prefs.theme) === "dark" ? "dark" : "light"; }
function applyTheme() {
  const dark = currentTheme() === "dark";
  document.documentElement.classList.toggle("dark", dark);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#1b1a19" : "#f3f2f2";
}
function toggleTheme() {
  if (!state._prefs) state._prefs = {};
  state._prefs.theme = currentTheme() === "dark" ? "light" : "dark";
  persist();
  applyTheme();
}

// ============================================================
// UI STATE
// ============================================================
const ui = {
  screen: "week",
  weekOffset: Math.min(Math.max(weekIdx(TODAY), 0), WEEKS - 1),
  selDay: null,
  curEx: null,
  timer: null, // {endsAt, next, go, hideAt}
  inputs: {},  // "k|exId|i" → {w, r} (session-scratch, not persisted)
};

function slots(rid) {
  return (R[rid].exs || []).map((e, i) => ({ i, id: e[0], name: e[1], sets: e[2], reps: e[3], repLow: e[4], rest: e[5], defW: e[6] }));
}
function fmtRest(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function fmtEntry(s) { return (s.w > 0 ? s.w + " lb" : "BW") + " × " + s.r; }
function fmtMD(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function rowCount(k, slot) { return Math.max(slot.sets, getLogged(k, slot.id).length); }
function inputFor(k, slot, i) {
  const key = k + "|" + slot.id + "|" + i;
  if (ui.inputs[key]) return ui.inputs[key];
  const logged = getLogged(k, slot.id).filter(Boolean);
  if (logged.length) { const p = logged[logged.length - 1]; return { w: p.w ?? 0, r: p.r }; }
  const prev = lastSession(slot.id, k);
  if (prev && prev.sets.length) { const p = prev.sets[0]; return { w: p.w ?? 0, r: p.r }; }
  return { w: slot.defW, r: slot.repLow };
}

// ============================================================
// ICONS (duotone, from the prototype)

const ICON_LIFT = '<svg width="28" height="28" viewBox="0 0 32 32"><rect x="2.5" y="10.5" width="4" height="11" rx="1.2" fill="currentColor" opacity="0.3"/><rect x="25.5" y="10.5" width="4" height="11" rx="1.2" fill="currentColor" opacity="0.3"/><rect x="7.5" y="12.5" width="3.4" height="7" rx="1" fill="currentColor"/><rect x="21.1" y="12.5" width="3.4" height="7" rx="1" fill="currentColor"/><rect x="10.9" y="15" width="10.2" height="2" fill="currentColor"/></svg>';
const ICON_BIKE = '<svg width="28" height="28" viewBox="0 0 32 32"><circle cx="8" cy="21" r="5.5" fill="currentColor" opacity="0.25"/><circle cx="24" cy="21" r="5.5" fill="currentColor" opacity="0.25"/><circle cx="8" cy="21" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="24" cy="21" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21 L13 11.5 L20.5 11.5 L24 21 M13 11.5 L17.5 21 M11 8.5 L15.5 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_REST = '<svg width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="currentColor" opacity="0.2"/><path d="M20.5 6.5 A11 11 0 1 0 25.5 20.5 A9 9 0 0 1 20.5 6.5 Z" fill="currentColor"/></svg>';

// ============================================================
// RENDER
// ============================================================
const app = document.getElementById("app");
const timerRoot = document.getElementById("timerRoot");

function rulePair() { return '<div class="rule-thick" style="margin-top:4px"></div><div class="rule-thin"></div>'; }

function renderWeek() {
  const off = ui.weekOffset;
  const mon = addDays(PROG_START, off * 7);
  const sun = addDays(mon, 6);
  const chest = isChestWeek(mon);
  const deload = isDeloadIdx(off);
  let doneCt = 0;
  let tiles = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i);
    const k = dk(d);
    const rid = routineFor(k);
    const r = R[rid];
    const isToday = k === TODAY_K;
    const done = isDone(k);
    if (done) doneCt++;
    const parts = r.name.split(" — ");
    const meta = r.kind === "lift" ? parts[1] + " · " + r.exs.length + " exercises"
      : rid === "tempo" ? "45–60 min · Zone 3" : rid === "long" ? "60–90 min · Zone 2" : "Recovery";
    let mark = "", markColor = "", markSize = "16px";
    if (done) { mark = "✓"; markColor = "var(--status-green)"; }
    else if (isSkipped(k)) { mark = "✕"; markColor = "var(--status-red)"; }
    else if (k < TODAY_K && r.kind !== "rest") { mark = "●"; markColor = "var(--color-process-yellow)"; markSize = "13px"; }
    const iconColor = r.kind === "lift" ? "var(--color-accent-2)" : r.kind === "bike" ? "var(--color-accent)" : "var(--color-neutral-500)";
    const icon = r.kind === "lift" ? ICON_LIFT : r.kind === "bike" ? ICON_BIKE : ICON_REST;
    tiles += `
      <button class="card tile${isToday ? " today" : ""}" data-act="open-day" data-k="${k}">
        <span class="dateblk">
          <span class="dow">${["MON","TUE","WED","THU","FRI","SAT","SUN"][i]}</span>
          <span class="dom">${d.getDate()}</span>
        </span>
        <span class="icon" style="color:${iconColor}">${icon}</span>
        <span class="nameblk">
          <span class="wname">${parts[0]}${isToday ? ' <span class="todaytag">· TODAY</span>' : ""}</span>
          <span class="meta">${meta}</span>
        </span>
        <span class="mark" style="color:${markColor};font-size:${markSize}">${mark}</span>
      </button>`;
  }
  const emph = (chest ? "Chest emphasis" : "Back emphasis") + (deload ? " · Deload — half sets, easy" : "");
  app.innerHTML = `
  <div class="wrap">
    <div class="weeknav">
      <a data-act="prev-week" class="${off > 0 ? "" : "dim"}">‹ Previous Week</a>
      <a data-act="next-week" class="${off < WEEKS - 1 ? "" : "dim"}">Next Week ›</a>
    </div>
    <div class="masthead">
      <span class="brand">Workouts</span>
      <span class="range">${fmtMD(mon)} – ${fmtMD(sun)}, ${sun.getFullYear()}</span>
    </div>
    ${rulePair().replace('margin-top:4px', 'margin-top:6px')}
    <div style="padding:18px 0 0">
      <div class="kicker">${emph}</div>
      <div class="headline-row">
        <div class="h">Week ${off + 1}</div>
        <div class="sub">${doneCt} of 7 logged</div>
      </div>
    </div>
    <div class="tiles">${tiles}</div>
    <div class="tools">
      <button data-act="toggle-theme">${currentTheme() === "dark" ? "Light mode" : "Dark mode"}</button>
      <button data-act="open-data">Export / Import data</button>
    </div>
  </div>`;
}

function crumb(items) {
  // items: [{label, act?}] — last one is the current page
  return '<div class="crumbs">' + items.map((it, i) => {
    const sep = i > 0 ? '<span class="sep">›</span>' : "";
    if (it.act) return sep + `<a data-act="${it.act}">${it.label}</a>`;
    return sep + `<span class="here">${it.label}</span>`;
  }).join("") + "</div>";
}

function dayShortLabel(d) { return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }); }
function dayLongLabel(d) { return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }); }

function renderDay() {
  const k = ui.selDay;
  const d = parseDk(k);
  const rid = routineFor(k);
  const r = R[rid];
  const exs = r.kind === "lift" ? slots(rid) : [];
  const done = isDone(k), skipped = isSkipped(k);
  const weekNum = Math.min(Math.max(weekIdx(d), 0), WEEKS - 1) + 1;

  const kick = done ? "Logged ✓" : skipped ? "Missed ✕"
    : r.kind === "lift" ? "Scheduled — Lift" : r.kind === "bike" ? "Scheduled — Ride" : "Scheduled — Rest";
  const kickColor = done ? "var(--status-green)" : skipped ? "var(--status-red)"
    : r.kind === "lift" ? "var(--color-accent-2-700)" : r.kind === "bike" ? "var(--color-accent-700)" : "var(--color-neutral-600)";

  let action = "";
  if (r.kind === "lift") {
    action = `<button class="btn btn-primary" data-act="start-session" style="width:100%;margin-top:16px;height:52px;font-size:16px">Start session</button>`;
  } else if (r.kind === "bike") {
    action = `<button class="btn btn-primary" data-act="mark-day-done" style="width:100%;margin-top:16px;height:52px;font-size:16px">${done ? "Logged ✓ — tap to un-mark" : "Mark ride done"}</button>`;
  } else {
    action = `<button class="btn btn-secondary" data-act="mark-day-done" style="width:100%;margin-top:16px;height:52px;font-size:15px">${done ? "Logged ✓ — tap to un-mark" : "Mark rest day"}</button>`;
  }
  const canMiss = !done && r.kind !== "rest" && k <= TODAY_K;
  const missBtn = canMiss
    ? `<button class="btn btn-ghost" data-act="toggle-miss" style="width:100%;margin-top:8px;font-size:13px;color:var(--status-red)">${skipped ? "Un-mark missed" : "Mark as missed ✕"}</button>`
    : "";

  const exIndex = r.kind === "lift" ? `
    <div class="exlist">
      ${exs.map(s => `
        <div class="exrow">
          <span class="n">${s.i + 1}</span>
          <span class="nm">${s.name}</span>
          <span class="sch">${s.sets} × ${s.reps} · rest ${fmtRest(s.rest)}</span>
        </div>`).join("")}
    </div>` : "";

  const opts = OPTION_ORDER.map(id => {
    const o = R[id], active = id === rid;
    const sw = o.kind === "lift" ? "background:var(--color-accent-2)"
      : o.kind === "bike" ? "background:var(--color-accent)"
      : "background:var(--color-bg);border:1px solid var(--color-neutral-400)";
    return `
      <button class="opt" data-act="pick-routine" data-rid="${id}">
        <span class="ring${active ? " on" : ""}"></span>
        <span class="olabel">${o.name}</span>
        <span class="swatch" style="${sw}"></span>
      </button>`;
  }).join("");

  app.innerHTML = `
  <div class="wrap">
    ${crumb([{ label: "Week " + weekNum, act: "back-week" }, { label: dayShortLabel(d) }])}
    ${rulePair()}
    <div class="dateline">${dayLongLabel(d)}</div>
    <div style="padding:22px 0 0">
      <div class="kicker" style="color:${kickColor}">${kick}</div>
      <div class="day-h">${r.name}</div>
      <div class="day-sub">${r.sub}</div>
      ${action}
      ${missBtn}
    </div>
    ${exIndex}
    <div class="opts">
      <div class="okick">Or run instead</div>
      ${opts}
    </div>
  </div>`;
}

function sessShortName(rid) { return R[rid].name.split(" — ")[0]; }

function renderSession() {
  const k = ui.selDay;
  const d = parseDk(k);
  const rid = routineFor(k);
  const exs = slots(rid);
  const weekNum = Math.min(Math.max(weekIdx(d), 0), WEEKS - 1) + 1;
  let exDone = 0;
  const tiles = exs.map(s => {
    const n = getLogged(k, s.id).filter(Boolean).length;
    const full = n >= s.sets;
    if (full) exDone++;
    const progColor = full ? "var(--color-accent-700)" : n > 0 ? "var(--color-accent-2-700)" : "var(--color-neutral-500)";
    return `
      <button class="card stile" data-act="open-ex" data-i="${s.i}">
        <span class="nameblk">
          <span class="wname">${s.name}</span>
          <span class="sch">${s.sets} × ${s.reps} · rest ${fmtRest(s.rest)}</span>
        </span>
        <span class="prog" style="color:${progColor}">${full ? "✓ " : ""}${n}/${s.sets} sets</span>
      </button>`;
  }).join("");

  app.innerHTML = `
  <div class="wrap">
    ${crumb([
      { label: "Week " + weekNum, act: "back-week" },
      { label: dayShortLabel(d), act: "back-day" },
      { label: sessShortName(rid) },
    ])}
    ${rulePair()}
    <div class="dateline-row"><span>${dayLongLabel(d)}</span><span>${exDone} of ${exs.length} exercises done</span></div>
    <div style="padding:20px 0 0">
      <div class="kicker">In session</div>
      <div style="font-family:var(--font-heading);font-weight:600;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin-top:5px">${R[rid].name}</div>
    </div>
    <div class="tiles" style="padding-bottom:0">${tiles}</div>
    <button class="btn finish-btn" data-act="finish-session">Finish session — mark day complete</button>
  </div>`;
}

function renderExercise() {
  const k = ui.selDay;
  const d = parseDk(k);
  const rid = routineFor(k);
  const exs = slots(rid);
  const slot = exs[ui.curEx];
  if (!slot) { ui.screen = "session"; return renderSession(); }

  const prev = lastSession(slot.id, k);

    ? "Last, " + fmtMD(parseDk(prev.k)) + ": " + prev.sets.map(fmtEntry).join(" · ")

  const logged = getLogged(k, slot.id);
  const total = rowCount(k, slot);
  let rowsHtml = "";

    if (e && e.r) {
      rowsHtml += `

            <span class="val"><span class="num">${inp.w > 0 ? inp.w : "BW"}</span><br><span class="unit">LB</span></span>
            <button class="btn btn-secondary" data-act="bump" data-i="${i}" data-f="w" data-d="1">+</button>
          </span>
          <span class="stepper">
            <button class="btn btn-secondary" data-act="bump" data-i="${i}" data-f="r" data-d="-1">−</button>
            <span class="val"><span class="num">${inp.r}</span><br><span class="unit">REPS</span></span>
            <button class="btn btn-secondary" data-act="bump" data-i="${i}" data-f="r" data-d="1">+</button>
          </span>
          <button class="btn btn-primary slog" data-act="log-set" data-i="${i}">✓</button>
        </div>`;
    }
  }

  const isLastEx = ui.curEx + 1 >= exs.length;
  const t = ui.timer;
  const exClock = t ? (t.go ? "GO" : fmtRest(Math.max(0, Math.round((t.endsAt - Date.now()) / 1000)))) : "";
  const exClockColor = t && t.go ? "var(--color-accent-700)" : "var(--color-accent-2-700)";

  app.innerHTML = `
  <div class="wrap">
    ${crumb([
      { label: "Week " + weekNum, act: "back-week" },
      { label: dayShortLabel(d), act: "back-day" },
      { label: sessShortName(rid), act: "back-session" },
      { label: slot.name },
    ])}
    ${rulePair()}
    <div class="dateline-row">
      <span style="letter-spacing:.06em;text-transform:uppercase">Exercise ${ui.curEx + 1} of ${exs.length}</span>
      <span>rest ${fmtRest(slot.rest)}</span>
    </div>
    <div style="padding:18px 0 0">
      <div class="ex-name-row">
        <div class="ex-h">${slot.name}</div>
        <span class="ex-clock" id="exClock" style="color:${exClockColor}">${exClock}</span>
      </div>
      <div class="ex-target">${slot.sets} sets × ${slot.reps} reps · rest ${fmtRest(slot.rest)}</div>
      <div class="ex-last">${lastLine}</div>
    </div>
    <div class="sets">
      ${rowsHtml}
      <button class="btn btn-ghost" data-act="add-set" style="align-self:flex-start;font-size:12.5px">+ Add a set</button>
      <div class="helper">Logging a set starts the ${fmtRest(slot.rest)} rest clock.</div>
      <button class="btn btn-ghost" data-act="ex-next" style="align-self:flex-end;font-size:13.5px;margin-bottom:20px">${isLastEx ? "Back to session ›" : "Next: " + exs[ui.curEx + 1].name + " ›"}</button>
    </div>
  </div>`;
}

function renderTimer() {
  const t = ui.timer;
  const onTimerScreens = ui.screen === "session" || ui.screen === "exercise";
  if (t) {
    const rem = Math.max(0, Math.round((t.endsAt - Date.now()) / 1000));
    timerRoot.innerHTML = `
      <div class="timerbar">
        <div class="tinfo">
          <div class="tkick" style="color:${t.go ? "var(--color-accent-700)" : "var(--color-accent-2-700)"}">${t.go ? "Go — lift" : "Resting"}</div>
          <div class="tnext">${t.next}</div>
        </div>
        <div class="tclock" id="timerClock">${t.go ? "0:00" : fmtRest(rem)}</div>
        <button class="btn btn-secondary tplus" data-act="timer-plus30">+30 s</button>
        <button class="btn btn-ghost tskip" data-act="timer-skip">✕</button>
      </div>`;
  } else if (onTimerScreens) {
    timerRoot.innerHTML = `<div class="idlestrip">Rest timer — starts when you log a set</div>`;
  } else {
    timerRoot.innerHTML = "";
  }
}

let _lastView = "";
function render() {
  if (ui.screen === "week") renderWeek();
  else if (ui.screen === "day") renderDay();
  else if (ui.screen === "session") renderSession();
  else renderExercise();
  renderTimer();
  syncWakeLock();
  // Scroll to top on navigation only — not on in-place updates (set logging, steppers)
  const view = ui.screen + "|" + ui.selDay + "|" + ui.curEx + "|" + ui.weekOffset;
  if (view !== _lastView) window.scrollTo(0, 0);
  _lastView = view;
}

// ============================================================
// TIMER
// ============================================================
function startTimer(secs, nextLabel) {
  ui.timer = { endsAt: Date.now() + secs * 1000, next: nextLabel, go: false, hideAt: 0 };
  renderTimer();
}
setInterval(() => {
  const t = ui.timer;
  if (!t) return;
  const rem = t.endsAt - Date.now();
  if (rem <= 0 && !t.go) {
    t.go = true;
    t.hideAt = Date.now() + 9000;
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    renderTimer();
    if (ui.screen === "exercise") {
      const el = document.getElementById("exClock");
      if (el) { el.textContent = "GO"; el.style.color = "var(--color-accent-700)"; }
    }
  } else if (t.go && Date.now() > t.hideAt) {
    ui.timer = null;
    renderTimer();
    if (ui.screen === "exercise") {
      const el = document.getElementById("exClock");
      if (el) el.textContent = "";
    }
  } else if (!t.go) {
    const label = fmtRest(Math.max(0, Math.round(rem / 1000)));
    const clock = document.getElementById("timerClock");
    if (clock) clock.textContent = label;
    if (ui.screen === "exercise") {
      const el = document.getElementById("exClock");
      if (el) { el.textContent = label; el.style.color = "var(--color-accent-2-700)"; }
    }
  }
}, 250);

// ============================================================
// WAKE LOCK
// ============================================================
let wakeLock = null;
async function syncWakeLock() {
  const want = ui.screen === "session" || ui.screen === "exercise";
  try {
    if (want && !wakeLock && "wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") syncWakeLock();
});

// ============================================================
// EVENTS — one delegated handler
// ============================================================
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const k = ui.selDay;

  if (act === "prev-week") { if (ui.weekOffset > 0) { ui.weekOffset--; render(); } return; }
  if (act === "next-week") { if (ui.weekOffset < WEEKS - 1) { ui.weekOffset++; render(); } return; }
  if (act === "open-day") { ui.selDay = el.dataset.k; ui.weekOffset = Math.min(Math.max(weekIdx(parseDk(el.dataset.k)), 0), WEEKS - 1); ui.screen = "day"; render(); return; }
  if (act === "back-week") { ui.screen = "week"; render(); return; }
  if (act === "back-day") { ui.screen = "day"; render(); return; }
  if (act === "back-session") { ui.screen = "session"; render(); return; }

  if (act === "start-session") { ui.screen = "session"; render(); return; }
  if (act === "mark-day-done") { setDone(k, !isDone(k)); ui.screen = "week"; render(); return; }
  if (act === "toggle-miss") { toggleSkipped(k); render(); return; }
  if (act === "pick-routine") { setOverride(k, el.dataset.rid); render(); return; }

  if (act === "open-ex") { ui.curEx = Number(el.dataset.i); ui.screen = "exercise"; render(); return; }
  if (act === "finish-session") { setDone(k, true); ui.screen = "week"; render(); return; }

  if (act === "bump") {
    const rid = routineFor(k);
    const slot = slots(rid)[ui.curEx];
    const i = Number(el.dataset.i);
    const key = k + "|" + slot.id + "|" + i;
    const cur = inputFor(k, slot, i);
    const f = el.dataset.f;
    const step = f === "w" ? WEIGHT_STEP : 1;
    const val = Math.max(0, (cur[f] || 0) + Number(el.dataset.d) * step);
    ui.inputs[key] = { ...cur, [f]: val };
    render();
    return;
  }
  if (act === "log-set") {
    const rid = routineFor(k);
    const exs = slots(rid);
    const slot = exs[ui.curEx];
    const i = Number(el.dataset.i);
    const inp = inputFor(k, slot, i);
    saveSet(k, slot.id, i, inp.w, inp.r);
    const total = rowCount(k, slot);
    let nextLabel;
    if (i + 1 < total) nextLabel = slot.name + " — set " + (i + 2) + " of " + total + " next";
    else nextLabel = ui.curEx + 1 < exs.length ? "Next: " + exs[ui.curEx + 1].name : "Last exercise done — finish up";
    startTimer(slot.rest, nextLabel);
    render();
    return;
  }
  if (act === "unlog-set") {
    const rid = routineFor(k);
    const slot = slots(rid)[ui.curEx];
    unlogSet(k, slot.id, Number(el.dataset.i));
    render();
    return;
  }
  if (act === "add-set") {
    const rid = routineFor(k);
    const slot = slots(rid)[ui.curEx];
    addExtraSet(k, slot.id, rowCount(k, slot));
    render();
    return;
  }
  if (act === "ex-next") {
    const exs = slots(routineFor(k));
    if (ui.curEx + 1 >= exs.length) ui.screen = "session";
    else ui.curEx++;
    render();
    return;
  }

  if (act === "timer-plus30") {
    const t = ui.timer;
    if (!t) return;
    if (t.go) { t.go = false; t.endsAt = Date.now() + 30000; }
    else t.endsAt += 30000;
    renderTimer();
    return;
  }
  if (act === "timer-skip") { ui.timer = null; renderTimer(); if (ui.screen === "exercise") render(); return; }

  if (act === "toggle-theme") { toggleTheme(); render(); return; }
  if (act === "open-data") { openDataModal(); return; }
});

// Re-render when another app (e.g. Blended Rhythm) toggles workout completion
if (window.cosShared) window.cosShared.subscribe(() => render());

// ============================================================
// EXPORT / IMPORT (carried over from the previous app — same wrapper format)
// ============================================================
const EXPORT_KEYS = ["cos-shared-v1", "workout-schedule-v3", "workout-schedule-v2", "blended-rhythm-v1"];
function buildExport() {
  const stores = {};
  for (const kk of EXPORT_KEYS) {
    const raw = localStorage.getItem(kk);
    if (raw == null) continue;
    try { stores[kk] = JSON.parse(raw); } catch (e) { stores[kk] = raw; }
  }
  return { exportVersion: 1, exportedAt: new Date().toISOString(), source: "workout-app", stores };
}
function applyImport(parsed) {
  if (!parsed || typeof parsed !== "object") throw new Error("not an object");
  if (parsed.stores && typeof parsed.stores === "object") {
    for (const [kk, v] of Object.entries(parsed.stores)) {
      localStorage.setItem(kk, typeof v === "string" ? v : JSON.stringify(v));
    }
    return Object.keys(parsed.stores).length;
  }
  if (parsed.days || parsed.version) {
    localStorage.setItem("cos-shared-v1", JSON.stringify(parsed));
    return 1;
  }
  throw new Error("doesn't look like exported app data");
}
const dataModal = document.getElementById("dataModal");
function openDataModal() {
  document.getElementById("dataExport").value = JSON.stringify(buildExport(), null, 2);
  document.getElementById("dataImport").value = "";
  dataModal.classList.add("open");
}
document.getElementById("dataModalClose").addEventListener("click", () => dataModal.classList.remove("open"));
dataModal.addEventListener("click", e => { if (e.target === dataModal) dataModal.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && dataModal.classList.contains("open")) dataModal.classList.remove("open");
});
document.getElementById("dataCopyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("dataCopyBtn");
  const ta = document.getElementById("dataExport");
  try { await navigator.clipboard.writeText(ta.value); btn.textContent = "✓ Copied"; }
  catch (e) { ta.select(); document.execCommand("copy"); btn.textContent = "✓ Copied (fallback)"; }
  setTimeout(() => btn.textContent = "Copy to clipboard", 2000);
});
document.getElementById("dataImportBtn").addEventListener("click", () => {
  const raw = document.getElementById("dataImport").value.trim();
  if (!raw) { alert("Paste exported JSON in the box first."); return; }
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) { alert("That doesn't parse as JSON. Make sure you copied the entire export."); return; }
  const looksValid = parsed && (parsed.stores || parsed.days || parsed.version);
  if (!looksValid) { alert("That doesn't look like exported app data."); return; }
  const count = parsed.stores ? Object.keys(parsed.stores).length : 1;
  if (!confirm("This will REPLACE current data on this device with the imported data. " + count + " store(s) will be overwritten. Continue?")) return;
  try { applyImport(parsed); }
  catch (err) { alert("Couldn't import: " + err.message); return; }
  state = loadState();
  dataModal.classList.remove("open");
  render();
  alert("Imported. If anything still looks off, fully reload the page.");
});

// ============================================================
applyTheme();
render();
</script>
</body>
</html>
